name: Build JC3248W535C diagnostic firmware
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio esptool
      - name: Build firmware
        run: pio run -e jc3248w535c
      - name: Prepare merged image at address 0x0
        shell: bash
        run: |
          python -m esptool --chip esp32s3 merge_bin -o JC3248W535C_DIAG_V2_fullflash.bin --flash_mode dio --flash_freq 40m --flash_size 16MB \
            0x0 .pio/build/jc3248w535c/bootloader.bin \
            0x8000 .pio/build/jc3248w535c/partitions.bin \
            0x10000 .pio/build/jc3248w535c/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: JC3248W535C_DIAG_V2_fullflash
          path: JC3248W535C_DIAG_V2_fullflash.bin
