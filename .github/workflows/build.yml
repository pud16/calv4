name: Build JC3248W535C Calendar v4
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio 'esptool<5'
      - run: pio run -e jc3248w535c
      - name: Build complete flash image (offset 0x0)
        run: |
          python -m esptool --chip esp32s3 merge_bin -o JC3248W535C_CALENDAR_V4_fullflash.bin --flash_mode dio --flash_freq 40m --flash_size 16MB \
            0x0 .pio/build/jc3248w535c/bootloader.bin \
            0x8000 .pio/build/jc3248w535c/partitions.bin \
            0x10000 .pio/build/jc3248w535c/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: JC3248W535C_CALENDAR_V4_fullflash
          path: JC3248W535C_CALENDAR_V4_fullflash.bin

